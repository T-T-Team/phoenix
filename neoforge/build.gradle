import net.darkhax.curseforgegradle.Constants
import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.neoforged.gradle.userdev' version "${neogradle_version}"
    id 'net.darkhax.curseforgegradle' version "${cursegradle_plugin_version}"
    id 'com.modrinth.minotaur' version "${modrinth_plugin_version}"
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run/client')
    }

    server {
        workingDirectory project.file('run/server')
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
    implementation "dev.toma.configuration:configuration-neoforge:${project.configuration_version}"
    compileOnly project(":common")
}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.named('compileJava', JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_name}",
                "Specification-Vendor"    : "${mod_authors}",
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : "${mod_name}",
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : "${mod_authors}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    exclude("${mod_id}.accesswidener")
    archiveFileName = "${mod_id}-neoforge-${project.version}.jar"
}

List versionList = compatible_mc_versions.split(",")
tasks.register("curseforge", TaskPublishCurseForge) {
    dependsOn(tasks.jar)
    group = "publishing"
    apiToken = project.findProperty("CURSEFORGE_TOKEN").toString() ?: ""
    debugMode = debug_publish.toBoolean()

    def artifact = upload(curseforge_project_id, tasks.jar.archiveFile)
    artifact.changelogType = Constants.CHANGELOG_MARKDOWN
    artifact.changelog = file("../CHANGELOG.md").exists() ? file("../CHANGELOG.md").text : "-- No changelog --"
    artifact.releaseType = Constants.RELEASE_TYPE_RELEASE
    artifact.displayName = "phoenix-neoforge-${version}"
    artifact.addModLoader("NeoForge")
    artifact.addEnvironment("Client", "Server")
    artifact.addJavaVersion("Java 25")
    artifact.addRequirement("configuration")
    versionList.each { gameVersion ->
        artifact.addGameVersion(gameVersion)
    }
}

modrinth {
    token = project.findProperty("MODRINTH_TOKEN").toString() ?: ""
    projectId = modrinth_project_id
    uploadFile = jar
    debugMode = debug_publish.toBoolean()
    versionNumber = "${version}"
    versionName = "phoenix-neoforge-${version}"
    versionType = "release"
    gameVersions = versionList
    changelog.set(
            providers.provider {
                def changelogFile = file("./CHANGELOG.md")
                changelogFile.exists() ? changelogFile.text : "-- No changelog provided --"
            }
    )
    loaders = ["neoforge"]
    dependencies {
        required.project("configuration")
    }
}
tasks.modrinth.dependsOn(tasks.jar)