modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
updateJSONURL = "https://raw.githubusercontent.com/T-T-Team/phoenix/refs/heads/main/versions.json"
description = '''
${mod_description}
'''

#[[mixins]]
#config = "phoenix.mixins.json"

[[dependencies.phoenix]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.phoenix]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.phoenix]]
    modId = "configuration"
    type = "required"
    versionRange = "[${configuration_min_version},)"
    ordering = "BEFORE"
    side = "BOTH"