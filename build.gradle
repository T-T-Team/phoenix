plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
}

allprojects {
    group = rootProject.mod_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'idea'

    java.toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")

    jar {
        manifest {
            attributes([
                    'Specification-Title'       : "${mod_name}",
                    'Specification-Vendor'      : "${mod_authors}",
                    'Specification-Version'     : "${project.jar.archiveVersion}",
                    'Implementation-Title'      : "${project.name}",
                    'Implementation-Version'    : "${project.jar.archiveVersion}",
                    'Implementation-Vendor'     : "${mod_authors}",
                    'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'                 : System.currentTimeMillis()
            ])
        }
    }

    repositories {
        mavenCentral()

        maven {
            name = "Sponge / Mixin"
            url  = "https://repo.spongepowered.org/repository/maven-public/"
        }
        maven {
            name = "Toma"
            url = "https://repo.repsy.io/mvn/toma/public/"
        }
    }

    processResources {
        def props = [
                // Mod
                "version": rootProject.mod_version,
                "mod_id": "${mod_id}",
                "mod_name": "${mod_name}",
                "mod_authors": "${mod_authors}",
                "mod_license": "${mod_license}",
                "mod_description": "${mod_description}",
                "mod_group": "${mod_group}",

                // Minecraft env
                "java_version": "${java_version}",
                "minecraft_version": "${minecraft_version}",
                "minecraft_version_range": "${minecraft_version_range}",
                "vanilla_gradle_version": "${vanilla_gradle_version}",

                // Mixin env
                "mixin_loader": "${mixin_loader}",
                "mixin_version": "${mixin_version}",
                "mixin_min_version": "${mixin_min_version}",

                // Neoforge
                "neoforge_version": "${neoforge_version}",
                "neoforge_version_range": "${neoforge_version_range}",
                "neogradle_version": "${neogradle_version}",

                // Fabric
                "fabric_version": "${fabric_version}",
                "fabric_version_range": "${fabric_version_range}",
                "fabric_loader_version": "${fabric_loader_version}",
                "fabric_loader_version_range": "${fabric_loader_version_range}",
                "fabric_mc_version_range": "${fabric_mc_version_range}",

                "configuration_version": "${configuration_version}",
                "configuration_min_version": "${configuration_min_version}"
        ]

        filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/*.toml", "*.mixins.json"]) {
            expand(props)
        }
        inputs.properties(props)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.getRelease().set(project.java_version.toInteger())
    }

    // so gradle does not yell about no tests
    tasks.named('test') {
        enabled = false
    }
}

task uploadToCurseForge(dependsOn: [':fabric:curseforge', ':neoforge:curseforge']) {
    group = "publishing"
}

task uploadToModrinth(dependsOn: [':fabric:modrinth', ':neoforge:modrinth']) {
    group = "publishing"
}

task releaseMod(dependsOn: ['uploadToCurseForge', 'uploadToModrinth']) {
    group = "publishing"
}
